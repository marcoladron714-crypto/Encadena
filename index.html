<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego de entrenamiento de 100 niveles">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1524" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Encadena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Encadena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una columna para celular; marcador grande de nivel arriba, tarjetas de acción, mapa de 10 mundos x 10 nodos, barra de pestañas fija abajo */
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#14213a; --muted:#5d6577; --line:#e3e1da; --soft:#eeece6;
  --accent:#e2550f; --accent-ink:#ffffff; --accent-soft:#fbe6da;
  --bike:#0f7c86; --bike-soft:#d8eef0;
  --ok:#1f7a4a; --ok-soft:#dcefe3; --bad:#b4282d; --bad-soft:#f7dcdd;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --card:#162036; --ink:#eef0f5; --muted:#9aa3b8; --line:#26324c; --soft:#1c2840;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2214; --bike:#4fc6d0; --bike-soft:#143338;
  --ok:#5fd394; --ok-soft:#173826; --bad:#ff8a8f; --bad-soft:#3e1a1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --card:#162036; --ink:#eef0f5; --muted:#9aa3b8; --line:#26324c; --soft:#1c2840;
  --accent:#ff7a3d; --accent-ink:#1a0d05; --accent-soft:#3a2214; --bike:#4fc6d0; --bike-soft:#143338;
  --ok:#5fd394; --ok-soft:#173826; --bad:#ff8a8f; --bad-soft:#3e1a1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
body.playing #app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1;text-wrap:balance}
h1{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.25rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .center{text-align:center;justify-content:center}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;color:var(--accent)}
.eyebrow.ok{color:var(--ok)} .eyebrow.bk{color:var(--bike)}
.lead{color:var(--muted);margin-top:6px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:700 1.02rem var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:10px;padding:12px 18px;cursor:pointer;min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.big{width:100%;font-size:1.25rem;min-height:56px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn.bike-btn{background:var(--bike);border-color:var(--bike);color:var(--card)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.warn{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:.88rem}
.hero{display:grid;gap:8px;padding-top:4px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:.9rem;color:var(--muted)}
.lvl{display:flex;align-items:flex-end;gap:10px;line-height:.8}
.lvl-label{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1.4rem;letter-spacing:.06em;padding-bottom:10px}
.lvl-num{font-family:var(--display);font-weight:800;font-size:clamp(6rem,30vw,9rem);color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.world{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:1.05rem}
.bar100{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar100 i{display:block;height:100%;background:var(--accent);min-width:2px}
.mini{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted)}
.mini b{font-family:var(--display);font-size:1.25rem;color:var(--ink);margin-right:3px;font-variant-numeric:tabular-nums}
.mini.big b{font-size:2rem}
.today{border-color:var(--accent);border-width:2px}
.eqrow{display:flex;flex-wrap:wrap;gap:6px}
.chip-eq{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:5px;background:var(--soft);color:var(--muted)}
.chip-eq.buy{background:var(--accent-soft);color:var(--accent)}
.bike{border-color:var(--bike)}
.bike-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.rec{background:var(--bike-soft);color:var(--bike)}
.plan{font-size:.92rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.form .full{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.err{color:var(--bad);font-size:.85rem;min-height:0}
.sec-title{margin-bottom:8px}
.map{display:grid;gap:10px}
.world-row{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.wname{font-size:.9rem;display:flex;gap:6px;align-items:baseline}
.wname b{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:1rem}
.nodes{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:420px}
.node{aspect-ratio:1;max-width:100%;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;font:600 .78rem var(--body);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.node.light{transform:scale(.82)}
.node.boss{border-radius:6px;transform:rotate(45deg) scale(.82);border-color:var(--ink)}
.node.boss span{transform:rotate(-45deg)}
.node.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.node.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.node.sm{width:14px;height:14px;display:inline-block;cursor:default}
.top{display:flex}
.back{background:none;border:0;font:600 1rem var(--body);color:var(--muted);cursor:pointer;padding:6px 0}
.lhead{display:grid;gap:6px}
.eq-title{font-size:.85rem;color:var(--muted);margin-top:8px}
.gate{font-size:.9rem;background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:6px}
.gate.ok{background:var(--ok-soft);color:var(--ok)}
.lsec h3{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.lsec h3 .muted{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:500}
.its{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px}
.it-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:8px 12px;cursor:pointer}
.it-name{min-width:0;display:grid}
.it-name b{font-weight:600;line-height:1.25}
.it-name span{font-size:.85rem;color:var(--muted)}
.chev{color:var(--muted);font-size:1.3rem;transition:transform .15s}
.it.open .chev{transform:rotate(90deg)}
.it-body{padding:0 14px 14px;display:grid;gap:10px;border-top:1px dashed var(--line)}
.it-body ol,.steps{margin:8px 0 0;padding-left:1.2em;display:grid;gap:3px;max-width:62ch}
.tip{font-size:.9rem;background:var(--soft);border-radius:8px;padding:8px 10px;max-width:62ch}
.tip b{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:4px}
.fig2{display:block;--figbg:var(--card);overflow:visible}
.fig2 .limb polyline,.fig2 .limb line,.fig2 .body{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.fig2 .far polyline,.fig2 .far line{stroke:var(--muted);opacity:.55}
.fig2 .head{fill:var(--figbg);stroke:var(--ink);stroke-width:3}
.fig2 .ground{stroke:var(--line);stroke-width:1.5}
.fig2 .prop rect,.fig2 .prop line,.fig2 .prop circle,.fig2 line.prop,.fig2 rect.prop{fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round}
.fig2 .band{stroke:var(--accent);stroke-width:1.6;fill:none}
.fig2 .kb{fill:var(--accent)}
.fig2 .kbh{fill:none;stroke:var(--accent);stroke-width:1.5}
.fig2 .strap{stroke:var(--muted);stroke-width:1.2}
.fig2 .ring{fill:none;stroke:var(--accent);stroke-width:1.6}
.fig2 .palm{fill:var(--soft);stroke:var(--ink);stroke-width:2.4}
.fig2 .ghost{opacity:.22}
.fig2.xs{width:46px;height:29px;flex:none}
.fig2.sm{width:64px;height:40px;background:var(--soft);border-radius:8px;--figbg:var(--soft);flex:none}
.figwrap{margin:0;display:grid;gap:6px;justify-items:center}
.figwrap figcaption{font-size:.82rem;color:var(--muted);text-align:center}
.figwrap.lg{margin-top:10px;justify-items:start}
.figwrap.lg .fig2{width:100%;max-width:300px;height:auto;aspect-ratio:8/5;background:var(--soft);border-radius:12px;--figbg:var(--soft)}
.figwrap.xl .fig2{width:100%;max-width:400px;height:auto;aspect-ratio:8/5;background:var(--soft);border-radius:14px;--figbg:var(--soft)}
.figwrap.lg figcaption{text-align:left}
.swap{display:grid;gap:6px;background:var(--soft);border-radius:10px;padding:10px}
.alt{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:left;cursor:pointer}
.alt span{display:grid;font-size:.9rem}
.alt .muted{font-size:.78rem}
.startbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:3;padding-top:8px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.playtop{display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{flex:1;min-width:6px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--ink)}
.dots i.c{background:var(--accent)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:grid;gap:10px}
.pcard h1{font-size:clamp(2rem,9vw,2.8rem)}
.work{display:grid;gap:8px;margin-top:4px}
.set{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.set.ok{border-color:var(--ok);background:var(--ok-soft)}
.sn{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;min-width:4.5em}
.in{display:flex;align-items:center;gap:4px;font-size:.82rem;color:var(--muted)}
.in input{width:4.6em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:7px 4px}
.tick{margin-left:auto;font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.05em;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--card)}
.tick.wide{margin-left:0;flex:1}
.pnav{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timerbar.work{background:var(--accent);color:var(--accent-ink)}
.timerbar > div:first-child{display:grid}
.timerbar span{font-size:.85rem;opacity:.85}
.timerbar b{font-family:var(--display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.timerbar .btn.ghost{color:inherit;border-color:currentColor}
.celebrate{display:grid;gap:8px;text-align:left;padding:20px 0}
.celebrate h1{font-size:clamp(4rem,22vw,6.5rem);color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;border-bottom:1px solid var(--line);padding:6px 4px}
.tbl td{border-bottom:1px solid var(--line);padding:7px 4px}
.tbl .up{color:var(--ok)} .tbl .down{color:var(--bad)}
.filters{display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-block:8px}
.search{padding:10px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;font:600 .85rem var(--body);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.tiles b{font-family:var(--display);font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.tiles span{font-size:.78rem;color:var(--muted);line-height:1.25}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent-soft);stroke:none}
.chart .pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.chart .endp{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .endl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--body)}
.chart .band{fill:var(--ok-soft)}
.chart .bandt{fill:var(--ok);font-size:10px;font-weight:600;font-family:var(--body)}
.smalls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sm-chart p{display:flex;justify-content:space-between;font-size:.85rem;gap:6px}
.sm-chart p span{font-family:var(--display);font-weight:700;font-size:1.1rem}
.hscroll{overflow-x:auto}
.heat{width:100%;min-width:320px;height:auto;display:block}
.heat .hc{fill:var(--soft)}
.heat .hc.lv{fill:var(--accent)}
.heat .hc.bk{fill:var(--bike)}
.heat .hc.fut{opacity:.3}
.heat .ax{fill:var(--muted);font-size:9px;font-family:var(--body)}
.sq{width:12px;height:12px;border-radius:3px;background:var(--soft);display:inline-block}
.sq.lv{background:var(--accent)} .sq.bk{background:var(--bike)}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:4.2em 1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0;font-size:.92rem}
.hist li b{font-weight:600;min-width:0}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav button{background:none;border:0;padding:12px 4px 14px;font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
#nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
.fig3{display:block;flex:none;background:var(--soft);object-fit:contain}
img.fig3.xs{width:46px;height:29px;border-radius:5px}
img.fig3.sm{width:64px;height:40px;border-radius:8px}
.figwrap.lg canvas.fig3{width:100%;max-width:340px;aspect-ratio:8/5;border-radius:12px}
.figwrap.xl canvas.fig3{width:100%;max-width:440px;aspect-ratio:8/5;border-radius:14px}
.nudge{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:600}
.week.done{border-color:var(--ok)}
.streak{display:grid;justify-items:end;line-height:1}
.streak b{font-family:var(--display);font-size:2.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.streak span{font-size:.75rem;color:var(--muted);text-align:right}
.wdots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wdots i{flex:1;max-width:64px;min-width:18px;height:12px;border-radius:6px;background:var(--soft);border:1px solid var(--line)}
.wdots i.on{background:var(--accent);border-color:var(--accent)}
.week.done .wdots i.on{background:var(--ok);border-color:var(--ok)}
.wdots .extra{font-family:var(--display);font-weight:700;color:var(--ok)}
.wstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.wk{border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:grid;justify-items:center;background:var(--soft)}
.wk b{font-family:var(--display);font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.wk span{font-size:.62rem;color:var(--muted);white-space:nowrap}
.wk.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk.ok span{color:var(--accent-ink);opacity:.85}
.wk.part{background:var(--accent-soft)}
.sq.part{background:var(--accent-soft);border:1px solid var(--line)}
@media (orientation:landscape) and (max-height:640px){
  body.playing #app{max-width:none;padding-top:10px}
  body.playing .pcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:22px;row-gap:8px;align-items:start}
  body.playing .pcard > *{grid-column:1}
  body.playing .pcard > .figwrap.xl{grid-column:2;grid-row:1 / span 8;position:sticky;top:10px;align-self:start}
  body.playing .figwrap.xl canvas.fig3,body.playing .figwrap.xl .fig2{max-width:none;width:100%}
  body.playing .pcard h1{font-size:2rem}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const worldOf = n => Math.ceil(n/10);
function typeOf(n){
  const k=((n-1)%10)+1;
  if(k===10) return "J";
  if(k===5) return "L";
  const idx = k<5 ? k-1 : k-6;
  return "ABCD"[(idx + worldOf(n)-1)%4];
}
function maxD(w){return w<=2?2:w<=4?3:w<=6?4:5}
function targetD(w){return 1+(w-1)*0.45}
function eligible(id,w){const x=BY[id];return x.w0<=w&&w<=x.w1&&x.d<=maxD(w)}

function pick(pool,w,r,used){
  let c=POOLS[pool].filter(id=>!used.has(id)&&eligible(id,w));
  if(!c.length) c=POOLS[pool].filter(id=>!used.has(id)&&BY[id].d<=maxD(w));
  if(!c.length) c=POOLS[pool].filter(id=>!used.has(id));
  const t=targetD(w);
  let best=null,bs=1e9;
  for(const id of c){const s=Math.abs(BY[id].d-t)+r()*2.2; if(s<bs){bs=s;best=id}}
  used.add(best); return best;
}
function pickFrom(list,k,r,used){
  const c=list.filter(id=>!used.has(id)).map(id=>[id,r()]).sort((a,b)=>a[1]-b[1]).slice(0,k).map(a=>a[0]);
  c.forEach(id=>used.add(id)); return c;
}
function presc(id,w,setsN,rest){
  const x=BY[id]; const g=Math.max(0,w-x.w0);
  let v;
  if(x.u==="s"||x.u==="sl"){v=Math.min(Math.round(x.b*1.8/5)*5,Math.round((x.b*(1+0.12*g))/5)*5)}
  else{v=Math.min(Math.round(x.b*1.6),Math.round(x.b*(1+0.08*g)))}
  const lb=x.l?x.l+5*Math.floor(g/3):0;
  return {id,sets:setsN,val:v,unit:x.u,rest:rest,lb};
}
function restFor(id,base){const x=BY[id];return x.pat==="jump"||/explosiva|muscle/.test(id)?Math.max(base,90):(x.u==="s"||x.u==="sl")?Math.max(40,base-15):base}

function genLevel(n){
  const w=worldOf(n), type=typeOf(n), r=mulberry(n*7919+13), used=new Set();
  const L={n,w,type,sections:[]};
  const opener = n%2 ? "saltos-tijera" : "cuerda-suave";
  used.add(opener);
  const warm=[opener,...pickFrom(WARM[type],3,r,used)].map(id=>presc(id,w,1,0));
  L.sections.push({key:"cal",title:"Calentamiento",items:warm});
  if(type==="J"){
    L.sections.push({key:"test",title:"Pruebas del jefe",items:TESTS.map(t=>({id:t.ex,test:t.id,sets:1,val:0,unit:t.unit,rest:180,lb:0}))});
  } else {
    const setsN = type==="L"?2 : type==="D"?3 : w<=3?3:4;
    const base = type==="L"?30:60;
    const main=TEMPLATES[type].map(pool=>{const id=pick(pool,w,r,used);const p=presc(id,w,setsN,restFor(id,base));p.pool=pool;return p});
    L.sections.push({key:"main",title:type==="L"?"Bloque ligero":"Bloque principal",items:main});
    if(type!=="L"){
      const fin=[];const cands=POOLS.fin.filter(id=>!used.has(id)&&eligible(id,w));
      const pool=cands.length>=2?cands:POOLS.fin.filter(id=>!used.has(id));
      const sorted=pool.map(id=>[id,r()]).sort((a,b)=>a[1]-b[1]).slice(0,2).map(a=>a[0]);
      sorted.forEach(id=>{used.add(id);fin.push({id,sets:1,val:0,unit:"s",rest:0,lb:presc(id,w,1,0).lb,pool:"fin"})});
      const rounds=2+Math.floor(w/4)+(type==="D"?1:0);
      const work=Math.min(45,30+Math.floor((w-1)*1.7));
      L.sections.push({key:"fin",title:"Remate de cardio",rounds,work,restI:Math.max(15,60-work),items:fin});
    }
  }
  if(type==="J"){
    const close=["coreLight","antag","coreLight"].map(pool=>{const id=pick(pool,w,r,used);const p=presc(id,w,3,45);p.pool=pool;return p});
    L.sections.push({key:"main",title:"Bloque de cierre",items:close});
  }
  used.add("est-antebrazo");
  const est=["est-antebrazo",...pickFrom(STRETCH[type],3,r,used)].map(id=>presc(id,w,1,0));
  L.sections.push({key:"est",title:"Estiramiento",items:est});
  padLevel(L,r,used);
  return L;
}
const MIN_MIN=45;
const EXTRA={A:["antag","empAcc","core"],B:["legAcc","core","legMain"],C:["core","empAcc","armAcc"],D:["antag","legAcc","core"],L:["coreLight","mob","antag","legAcc"],J:["coreLight","mob"]};
function padLevel(L,r,used){
  const w=L.w,main=L.sections.find(s=>s.key==="main"),fin=L.sections.find(s=>s.key==="fin"),est=L.sections.find(s=>s.key==="est");
  const setsN=main?main.items[0].sets:3, base=L.type==="L"?30:60;
  if(L.type==="L"&&main){main.items.forEach(it=>{it.sets=3})}
  const extra=(EXTRA[L.type]||[]).slice();let finAdd=0,guard=0;
  while(levelMinutes(L)<MIN_MIN&&guard++<20){
    if(main&&extra.length&&main.items.length<6){const pool=extra.shift();const id=pick(pool,w,r,used);const p=presc(id,w,L.type==="L"?3:setsN,restFor(id,base));p.pool=pool;main.items.push(p);continue}
    if(fin&&finAdd<2){fin.rounds++;finAdd++;continue}
    if(L.type==="L"&&est.items.length<8){const c=X.filter(x=>x.c==="est"&&!used.has(x.id)).map(x=>x.id);if(c.length){const id=c[Math.floor(r()*c.length)];used.add(id);est.items.push(presc(id,w,1,0));continue}}
    if(main&&main.items.some(it=>it.sets<5)){const it=main.items.find(it=>it.sets<5&&it.pool!=="mob")||main.items.find(it=>it.sets<5);it.sets++;continue}
    if(est.items.length<7){const c=X.filter(x=>x.c==="est"&&!used.has(x.id)).map(x=>x.id);if(c.length){const id=c[Math.floor(r()*c.length)];used.add(id);est.items.push(presc(id,w,1,0));continue}}
    break;
  }
}
function itemSeconds(it){
  const x=BY[it.id]; const per=(x.u==="rl"||x.u==="sl")?2:1;
  const work=(x.u==="s"||x.u==="sl")?it.val:it.val*3.2;
  return it.sets*(work*per+15)+Math.max(0,it.sets-1)*it.rest;
}
function levelMinutes(L){
  let s=0;
  for(const sec of L.sections){
    if(sec.key==="fin"){s+=sec.rounds*sec.items.length*(sec.work+sec.restI)+30}
    else if(sec.key==="test"){s+=TESTS.length*(90+180)}
    else for(const it of sec.items) s+=itemSeconds(it)+(sec.key==="main"?60:0);
  }
  return Math.round(s/60);
}
function levelEquip(L){
  const s=new Set();
  for(const sec of L.sections) for(const it of sec.items) BY[it.id].eq.forEach(e=>{if(e!=="nada")s.add(e)});
  return [...s];
}
function alternatives(it,w){
  const x=BY[it.id];
  let base = it.pool ? POOLS[it.pool] : X.filter(e=>e.c===x.c).map(e=>e.id);
  const out=base.filter(id=>id!==it.id&&BY[id].w0<=w+1&&Math.abs(BY[id].d-x.d)<=1).slice(0,6);
  return out.length?out:base.filter(id=>id!==it.id).slice(0,6);
}
function fmtVal(unit,v){return unit==="r"?`${v} reps`:unit==="rl"?`${v} por lado`:unit==="s"?`${v} s`:`${v} s por lado`}
function bikePlan(k){
  const reps=Math.min(10,4+k);
  const total=10+reps*3+8;
  return {min:total, txt:`10 min suave · ${reps} × (1 min fuerte / 2 min suave) · 8 min suave`};
}

      const c=d.chest?j.clone().addScaledVector(new THREE.Vector3().crossVectors(tb[1],tb[0]),3.5).add(v3(0,-2,0)):j.clone().add(v3(0,-5.2,0));kb.position.copy(c);h.position.copy(c).add(v3(0,2.6,0));h.rotation.set(0,Math.PI/2,0)}
    else if(d.t==="db"||d.t==="dbrot"){const i=wi++;const hh=D["dbh"+i],a=D["dbA"+i],b=D["dbB"+i];if(!hh)continue;
      let ax;if(d.t==="dbrot"){const fd=J.W1.clone().sub(J.E1).normalize();const r=(p.rot||0)*Math.PI/180;ax=v3(0,1,0).applyAxisAngle(fd,r)}else ax=d.v?new THREE.Vector3().crossVectors(tb[1],tb[0]).normalize():tb[0].clone();
      const c=j.clone().addScaledVector(J.W1.clone().sub(J.E1).normalize(),1.6);
      const e1=c.clone().addScaledVector(ax,4.2),e2=c.clone().addScaledVector(ax,-4.2);

      for(const [o,pt] of [[a,e1],[b,e2]]){o.position.copy(pt);o.quaternion.setFromUnitVectors(UPV,ax)}}
    else if(d.t==="fband"){const o=D.fband;o.visible=true;const fd=J.W1.clone().sub(J.E1).normalize();o.position.copy(J.W1).addScaledVector(fd,2.8);o.quaternion.setFromUnitVectors(v3(0,0,1),fd);const s=1.6+(p.spread||0)*1.1;o.scale.set(s,s*1.4,1)}

/* --- cámara y render --- */
const CAMDIR=HAS3?{side:v3(0.38,0.42,1).normalize(),front:v3(1,0.36,0.5).normalize(),top:v3(0.32,1,0.62).normalize()}:{};
const SPECBB={};
function specBox(id){
  if(SPECBB[id])return SPECBB[id];
  const spec=spec3(id),mode=modeOf(spec);const b=new THREE.Box3();let handX=null;
  const poses=[];spec.k.forEach((p,i)=>{poses.push(p);poses.push(lerpPose(p,spec.k[(i+1)%spec.k.length],.5))});
  poses.forEach(p=>{const J=joints3(p,mode);for(const k of ["S1","S2","W1","W2","P1","P2","F1","F2","K1","K2","E1","E2"])b.expandByPoint(J[k]);b.expandByPoint(J.H.clone().add(v3(0,5.5,0)));if(handX===null)handX=J.W1.x});
  const bb={minX:b.min.x,maxX:b.max.x,minZ:b.min.z,maxZ:b.max.z,handX,box:b,mode};
  SPECBB[id]=bb;return bb;
}
function propsFor(id){
  initScene();if(SC.props[id])return SC.props[id];
  const spec=spec3(id),bb=specBox(id);const g=buildProps(id,spec,bb.mode,bb);g.visible=false;SC.scene.add(g);
  const full=bb.box.clone();const pb=new THREE.Box3().setFromObject(g);
  if(!pb.isEmpty()){const pc=pb.clone();full.union(pc)}
  full.min.y=Math.max(full.min.y,-2);
  SC.props[id]={g,full};return SC.props[id];
}
const FITS={};
function fitCam(id,spec,mode,box,aspect){
  const key=id+"|"+aspect.toFixed(2);if(FITS[key])return FITS[key];
  const cam=new THREE.PerspectiveCamera(30,aspect,1,4000);
  const dir=CAMDIR[mode].clone();if(mode==="side"&&(spec.props||[]).some(q=>q.t==="bar"))dir.set(0.9,0.32,0.62).normalize();const ctr0=box.getCenter(new THREE.Vector3());
  for(const q of (spec.props||[]))if(q.t==="wall"){if(mode==="side"&&q.x>ctr0.x-4)dir.x=-dir.x;if(mode==="front"&&-(q.x-80)>0)dir.z=-dir.z}
  const pts=[];for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z])pts.push(v3(x,y,z));
  let ctr=ctr0.clone(),dist=box.getSize(new THREE.Vector3()).length()*1.6;
  for(let it=0;it<6;it++){
    cam.position.copy(ctr).addScaledVector(dir,dist);cam.lookAt(ctr);cam.updateMatrixWorld();cam.updateProjectionMatrix();
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const q of pts){const n=q.clone().project(cam);x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)}
    const span=Math.max((x1-x0)/2,(y1-y0)/2);
    const cx=(x0+x1)/2,cy=(y0+y1)/2;
    const right=v3(1,0,0).applyQuaternion(cam.quaternion),upv=v3(0,1,0).applyQuaternion(cam.quaternion);
    const halfH=Math.tan(cam.fov*Math.PI/360)*dist,halfW=halfH*aspect;
    ctr.addScaledVector(right,cx*halfW).addScaledVector(upv,cy*halfH);
    dist*=span/0.86;
  }
  const f={ctr,dist,pos:ctr.clone().addScaledVector(dir,dist)};FITS[key]=f;return f;
}
function renderPose3(id,p,w,h,phase){
  const sc=initScene();const spec=spec3(id),mode=modeOf(spec);
  if(sc.current!==id){if(sc.current&&sc.props[sc.current])sc.props[sc.current].g.visible=false;sc.current=id}
  const pr=propsFor(id);pr.g.visible=true;
  const J=joints3(p,mode);J.spread1=p.spread||0;
  poseFigure(sc.fig,J);placeDyn(spec,p,J,mode,phase||0);
  if(sc.w!==w||sc.h!==h){sc.renderer.setSize(w,h,false);sc.w=w;sc.h=h}
  const cam=sc.camera;cam.aspect=w/h;
  const fit=fitCam(id,spec,mode,pr.full,cam.aspect);const ctr=fit.ctr;
  cam.position.copy(fit.pos);cam.lookAt(ctr);cam.near=fit.dist*0.2;cam.far=fit.dist*4;cam.updateProjectionMatrix();
  sc.key.target.position.copy(ctr);sc.key.position.copy(ctr).add(v3(55,150,85));
  sc.fill.target.position.copy(ctr);sc.fill.position.copy(ctr).add(v3(-90,50,-60));
  sc.renderer.render(sc.scene,cam);
  return sc.renderer.domElement;
}
function thumbPose(id){const s=spec3(id);return s.k.length>1?lerpPose(s.k[0],s.k[1],0.85):s.k[0]}

/* --- integración con la página --- */
const THUMBS=new Map();
let thumbQ=[],thumbBusy=false;
function pumpThumbs(){
  if(thumbBusy)return;thumbBusy=true;
  const step=()=>{
    const t0=performance.now();
    while(thumbQ.length&&performance.now()-t0<24){
      const img=thumbQ.shift();if(!img.isConnected||img.src)continue;
      const id=img.dataset.thumb,size=img.dataset.size;const key=id+"|"+size;
      if(!THUMBS.has(key)){const w=size==="xs"?120:176,h=Math.round(w/1.6);try{const c=renderPose3(id,thumbPose(id),w,h,Math.PI);THUMBS.set(key,c.toDataURL("image/png"))}catch(e){THUMBS.set(key,"")}}
      const u=THUMBS.get(key);if(u)img.src=u;
    }
    if(thumbQ.length)requestAnimationFrame(step);else thumbBusy=false;
  };
  requestAnimationFrame(step);
}
let loop3=null,t03=0,last3=0;
function frame3(ts){
  loop3=requestAnimationFrame(frame3);if(ts-last3<33)return;last3=ts;
  const els=document.querySelectorAll("canvas[data-anim3]");if(!els.length){cancelAnimationFrame(loop3);loop3=null;return}
  els.forEach(cv=>{
    const id=cv.dataset.anim3,spec=spec3(id);
    const r=cv.getBoundingClientRect();if(!r.width)return;
    const dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.round(r.width*dpr),h=Math.round(r.width/1.6*dpr);
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
    const ms=ts-t03;const total=spec.d.reduce((a,b)=>a+b,0);
    const p=reduceMotion?thumbPose(id):frameAt(spec,ms);
    const src=renderPose3(id,p,w,h,((ms%total)/total)*Math.PI*2);
    const ctx=cv.getContext("2d");ctx.clearRect(0,0,w,h);ctx.drawImage(src,0,0,w,h);
  });
}
if(M3.ok){
  const fig2D=window.figSvg,start2D=window.startAnims;
  window.figSvg=function(id,size){
    if(!spec3(id))return fig2D(id,size);
    if(size==="lg"||size==="xl")return `<canvas class="fig3 ${size}" data-anim3="${id}" aria-hidden="true"></canvas>`;
    const u=THUMBS.get(id+"|"+size);
    return `<img class="fig3 ${size}" data-thumb="${id}" data-size="${size}" alt="" aria-hidden="true"${u?` src="${u}"`:""}>`;
  };
  window.startAnims=function(){
    try{
      document.querySelectorAll("img[data-thumb]:not([src])").forEach(i=>thumbQ.push(i));if(thumbQ.length)pumpThumbs();
      if(!loop3&&document.querySelector("canvas[data-anim3]")){t03=performance.now();loop3=requestAnimationFrame(frame3)}
    }catch(e){start2D&&start2D()}
  };
}

</script>
<script>
const $=s=>document.querySelector(s);

const st={cfg:null,cfgMsg:"",view:"juego",previewN:null,data:{sesiones:[],bici:[],cuerpo:[]},synced:false,local:false,swaps:{},open:null,swapKey:null,

  const b=st.data.bici.slice().sort((x,y)=>x.fecha<y.fecha?-1:1);

function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function weekStart(f){const d=new Date(f+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function addDays(f,n){const d=new Date(f+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)}
function weekInfo(){
  const meta=st.cfg.meta,cnt={};
  st.data.sesiones.forEach(s=>{const w=weekStart(s.fecha);cnt[w]=(cnt[w]||0)+1});
  const cur=weekStart(today());const weeks=[];
  const first=st.data.sesiones.length?weekStart(st.data.sesiones.map(s=>s.fecha).sort()[0]):cur;
  for(let w=first;w<=cur;w=addDays(w,7))weeks.push({w,n:cnt[w]||0,ok:(cnt[w]||0)>=meta});
  let streak=0;for(let i=weeks.length-2;i>=0;i--){if(weeks[i].ok)streak++;else break}
  const now=weeks[weeks.length-1];if(now.ok)streak++;
  let best=0,run=0;weeks.forEach(x=>{run=x.ok?run+1:0;best=Math.max(best,run)});
  const left=7-((new Date(today()+"T12:00:00").getDay()+6)%7);
  return {meta,now:now.n,ok:now.ok,streak,best,left,weeks};
}

function flatten(L){const f=[];L.sections.forEach((sec,si)=>sec.items.forEach((it,ii)=>f.push({si,ii,k:si+"-"+ii})));return f}

function saveInProgress(){const p=st.play;if(!p)return;try{localStorage.setItem("encadena-play",JSON.stringify({n:p.n,idx:p.idx,log:p.log,startedAt:p.startedAt,date:p.date,swaps:st.swaps[p.n]||{}}))}catch(e){}}
function loadInProgress(){try{const p=JSON.parse(localStorage.getItem("encadena-play")||"null");if(p&&p.date===today()&&p.n===current())return p;if(p)localStorage.removeItem("encadena-play")}catch(e){}return null}

function missingCount(){
  const p=st.play;let m=0;
  p.flat.forEach(f=>{const key=p.L.sections[f.si].key;if(key==="main"||key==="test"||key==="fin"){if(!p.log[f.k].every(r=>r.done))m++}});

/* ---------- temporizador ---------- */
let T=null,tick=null,ac=null,wake=null;
function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f||880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(d||0.18));o.start();o.stop(ac.currentTime+(d||0.18))}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate([180,90,180])}catch(e){}}
function startTimer(phases,onDone){
  T={phases,i:0,end:Date.now()+phases[0].sec*1000,onDone,lastBeep:null};
  beep(660,0.12);
  if(!tick) tick=setInterval(loop,200);
  paintTimer();
}
function loop(){
  if(!T){clearInterval(tick);tick=null;return}
  const left=(T.end-Date.now())/1000;
  const s=Math.ceil(left);
  if(s<=3&&s>=1&&T.lastBeep!==s){T.lastBeep=s;beep(520,0.08)}
  if(left<=0){
    T.i++;
    if(T.i>=T.phases.length){const cb=T.onDone;T=null;beep(990,0.35);buzz();if(cb)cb();paintTimer();return}
    T.end=Date.now()+T.phases[T.i].sec*1000;T.lastBeep=null;beep(T.phases[T.i].work?880:440,0.25);buzz();
  }
  paintTimer();
}
function paintTimer(){
  const bar=$("#timerbar");if(!bar)return;
  document.body.classList.toggle("timing",!!T&&st.view==="jugar");
  if(!T){bar.hidden=true;return}
  bar.hidden=false;const ph=T.phases[T.i];
  bar.classList.toggle("work",!!ph.work);
  $("#tLabel").textContent=ph.label+(T.phases.length>1&&ph.round?` · ronda ${ph.round}`:"");
  $("#tTime").textContent=fmtTime((T.end-Date.now())/1000);
}
function stopTimer(){T=null;paintTimer()}
async function keepAwake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&st.view==="jugar")keepAwake()});

function markDone(k,i,val){
  const p=st.play;const r=p.log[k][i];r.done=val;saveInProgress();
}

/* ---------- terminar ---------- */
async function finishLevel(){
  const p=st.play;const end=new Date();
  const mins=Math.max(1,Math.round((end-new Date(p.startedAt))/60000));
  const items=[];const pruebas={};
  p.flat.forEach(f=>{const sec=p.L.sections[f.si],it=sec.items[f.ii];
    const series=p.log[f.k].filter(r=>r.done).map(r=>({v:Number(r.v)||0,lb:r.lb?Number(r.lb):0}));
    items.push({k:f.k,id:it.id,nombre:BY[it.id].n,seccion:sec.key,series});
    if(sec.key==="test") pruebas[it.test]=Number(p.log[f.k][0].v)||0;
  });
  const doc={nivel:p.n,mundo:p.L.w,tipo:TYPES[p.L.type].n,fecha:today(),inicio:p.startedAt,fin:end.toISOString(),minutos:mins,items};
  if(p.L.type==="J") doc.pruebas=pruebas;
  const id="nivel-"+String(p.n).padStart(3,"0");
  try{await save("sesiones",id,doc)}catch(e){st.msg="No se pudo guardar el nivel. Revisa tu conexión e intenta de nuevo.";render();return}
  clearInProgress();stopTimer();
  try{wake&&wake.release()}catch(e){}
  const sets=items.filter(i=>i.seccion==="main").reduce((a,i)=>a+i.series.length,0);
  st.done={n:p.n,mins,sets,boss:p.L.type==="J",pruebas};
  st.play=null;delete st.swaps[p.n];
  go("hecho");
}
function viewDone(){
  const d=st.done;if(!d) return viewHome();
  const next=d.n+1, endWorld=d.n%10===0;
  let boss="";
  if(d.boss){const rec=records();boss=`<section class="card"><h3>Resultados del jefe</h3><table class="tbl"><tr><th>Prueba</th><th>Hoy</th><th>Antes</th></tr>${TESTS.map(t=>{const r=rec[t.id];const prev=r.filter(x=>x.n<d.n).pop();return `<tr><td>${esc(t.n)}</td><td><b>${d.pruebas[t.id]||0}</b></td><td>${prev?prev.v:"–"}</td></tr>`}).join("")}</table></section>`}
  return `<section class="celebrate"><p class="eyebrow ok">${endWorld?"Mundo completado":"Nivel encadenado"}</p><h1>Nivel ${d.n}</h1>
  <p class="lead">${endWorld?`Superaste el jefe del mundo ${worldOf(d.n)}. ${next<=100?"Sigue el mundo "+(worldOf(d.n)+1)+": "+WORLDS[worldOf(d.n)]+".":""}`:"Listo por hoy. Mañana sigue el nivel "+next+"."}</p>
  <div class="mini big"><span><b>${d.mins}</b> min</span><span><b>${d.sets}</b> series</span><span><b>${d.n}</b>/100</span></div></section>

function viewCatalog(){

/* ---------- progreso ---------- */
function niceTicks(min,max,count){
  if(min===max){min-=1;max+=1}
  const span=max-min,step0=span/count,mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0)||10*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];
  for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(4));return t;
}
function lineChart(o){
  const W=340,H=o.h||180,L=36,R=14,Tp=14,B=26;
  const xs=o.pts.map(p=>p[0]),ys=o.pts.map(p=>p[1]);
  let xMin=o.xMin??Math.min(...xs),xMax=o.xMax??Math.max(...xs);if(xMin===xMax){xMin-=1;xMax+=1}
  const yt=niceTicks(Math.min(...ys,...(o.band||[]),o.yMin??Infinity),Math.max(...ys,...(o.band||[])),3);
  const yMin=yt[0],yMax=yt[yt.length-1];
  const X0=v=>L+(v-xMin)/(xMax-xMin)*(W-L-R),Y0=v=>Tp+(1-(v-yMin)/(yMax-yMin))*(H-Tp-B);
  let g="";
  if(o.band) g+=`<rect class="band" x="${L}" y="${Y0(o.band[1])}" width="${W-L-R}" height="${Math.max(1,Y0(o.band[0])-Y0(o.band[1]))}"/><text class="bandt" x="${W-R-4}" y="${Y0(o.band[1])+12}" text-anchor="end">${esc(o.bandLabel||"")}</text>`;
  yt.forEach(v=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y0(v)}" y2="${Y0(v)}"/><text class="ax" x="${L-6}" y="${Y0(v)+4}" text-anchor="end">${v}</text>`});
  (o.xTicks||[]).forEach(([v,l])=>{g+=`<text class="ax" x="${X0(v)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`});
  const path=o.pts.map((p,i)=>(i?"L":"M")+X0(p[0]).toFixed(1)+" "+Y0(p[1]).toFixed(1)).join(" ");
  if(o.area&&o.pts.length>1) g+=`<path class="area" d="${path} L${X0(o.pts[o.pts.length-1][0]).toFixed(1)} ${Y0(yMin)} L${X0(o.pts[0][0]).toFixed(1)} ${Y0(yMin)} Z"/>`;
  g+=`<path class="ln" d="${path}"/>`;
  o.pts.forEach((p,i)=>{if(o.dots||i===o.pts.length-1)g+=`<circle class="${i===o.pts.length-1?"endp":"pt"}" cx="${X0(p[0])}" cy="${Y0(p[1])}" r="${i===o.pts.length-1?4.5:3}"/>`});
  const lp=o.pts[o.pts.length-1];
  g+=`<text class="endl" x="${Math.min(X0(lp[0]),W-R-2)}" y="${Y0(lp[1])-9}" text-anchor="end">${esc(o.fmt?o.fmt(lp[1]):lp[1])}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}</svg>`;
}
function heatmap(){
  const lv=new Set(st.data.sesiones.map(s=>s.fecha)),bk=new Set(st.data.bici.map(b=>b.fecha));
  const weeks=18;const now=new Date();const dow=(now.getDay()+6)%7;
  const start=new Date(now);start.setDate(now.getDate()-dow-(weeks-1)*7);
  let cells="",months="";let lastM=-1;
  for(let w=0;w<weeks;w++){for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);
    const f=dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());const fut=dt>now;
    const c=lv.has(f)?"lv":bk.has(f)?"bk":"";
    cells+=`<rect class="hc ${c} ${fut?"fut":""}" x="${w*17+22}" y="${d*17+16}" width="13" height="13" rx="3"><title>${fmtDate(f)}${lv.has(f)?" · nivel":""}${bk.has(f)?" · bici":""}</title></rect>`;
    if(d===0&&dt.getMonth()!==lastM){lastM=dt.getMonth();months+=`<text class="ax" x="${w*17+22}" y="10">${MES[lastM]}</text>`}}}
  const days=["L","","M","","V","","D"].map((l,i)=>l?`<text class="ax" x="2" y="${i*17+26}">${l}</text>`:"").join("");
  return `<div class="hscroll"><svg class="heat" viewBox="0 0 ${weeks*17+24} ${7*17+20}" role="img" aria-label="Calendario de días entrenados">${months}${days}${cells}</svg></div>
  <p class="legend"><span><i class="sq lv"></i>Nivel</span><span><i class="sq bk"></i>Bici</span><span><i class="sq"></i>Descanso</span></p>`;
}

  const body=st.data.cuerpo.slice().sort((a,b)=>a.fecha<b.fecha?-1:1);
  const pesos=body.filter(b=>b.peso);

    pesoHtml=lineChart({pts:pesos.map(b=>[daysBetween(s0,b.fecha),b.peso]),xMin:0,xMax:lastD,dots:true,band:[68,70],bandLabel:"Meta",label:"Peso corporal",xTicks:[[0,fmtDate(s0)],[lastD,fmtDate(pesos[pesos.length-1].fecha)]],fmt:v=>v+" kg"});}
  const MEDS=[["brazo","Brazo"],["pecho","Pecho"],["cintura","Cintura"],["muslo","Muslo"]];
  const medRows=MEDS.map(([k,l])=>{const v=body.filter(b=>b[k]);if(!v.length)return "";const a=v[0][k],z=v[v.length-1][k],d=+(z-a).toFixed(1);return `<tr><td>${l}</td><td>${a} cm</td><td>${z} cm</td><td class="${d>0?"up":d<0?"down":""}">${d>0?"+":""}${d} cm</td></tr>`}).join("");
  const hist=[...ses.map(s=>({f:s.fecha,t:`Nivel ${s.nivel} · ${s.tipo}`,m:s.minutos})),...st.data.bici.map(b=>({f:b.fecha,t:"Bici · "+(b.sensacion||""),m:b.minutos,bid:b._id}))].sort((a,b)=>a.f<b.f?1:-1).slice(0,12);
  return `<header class="lhead"><p class="eyebrow">Progreso</p><h1>Tu avance</h1>${start?`<p class="lead">Empezaste el ${fmtDate(start)}.</p>`:`<p class="lead">Todo empieza con el nivel 1.</p>`}</header>
  ${tiles}
  <section class="card"><h3>Avance en el mapa</h3><p class="muted small">Nivel alcanzado contra días desde que empezaste.</p>${avance}</section>

  <section class="card"><div class="bike-head"><h3>Peso y medidas</h3>${st.bodyForm?"":`<button class="btn ghost sm" data-act="bodyform">Registrar</button>`}</div>
    ${st.bodyForm?bodyForm():""}${pesoHtml}
    ${medRows?`<table class="tbl"><tr><th>Medida</th><th>Primera</th><th>Última</th><th>Cambio</th></tr>${medRows}</table>`:""}</section>

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act],[data-go]");if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return}
  const a=b.dataset.act,k=b.dataset.k;
  const p=st.play;
  switch(a){
    case "home":go("juego");break;
    case "preview":go("nivel",{previewN:+b.dataset.n});break;
    case "toggle":st.open=st.open===k?null:k;st.swapKey=null;render();break;
    case "swapopen":st.swapKey=k;render();break;
    case "swapclose":st.swapKey=null;render();break;
    case "swap":{const n=+b.dataset.n;st.swaps[n]=Object.assign({},st.swaps[n],{[k]:b.dataset.id});st.swapKey=null;render();break}
    case "swapplay":{st.swaps[p.n]=Object.assign({},st.swaps[p.n],{[k]:b.dataset.id});const keep={idx:p.idx,log:p.log,startedAt:p.startedAt};const f=p.flat[p.idx];delete keep.log[f.k];st.play=buildPlay(p.n,keep);st.swapKey=null;saveInProgress();render();break}
    case "start":{beep(1,0.001);st.play=buildPlay(+b.dataset.n,null);saveInProgress();keepAwake();go("jugar");break}
    case "resume":{const s=loadInProgress();if(!s)return render();st.swaps[s.n]=s.swaps||{};beep(1,0.001);st.play=buildPlay(s.n,s);keepAwake();go("jugar");break}
    case "quit":st.confirmQuit=true;render();break;
    case "quitno":st.confirmQuit=false;render();break;
    case "quityes":clearInProgress();stopTimer();st.play=null;try{wake&&wake.release()}catch(err){}go("juego");break;
    case "prev":if(p.idx>0){p.idx--;st.swapKey=null;saveInProgress();render();window.scrollTo(0,0)}break;
    case "next":if(p.idx<p.flat.length-1){p.idx++;st.swapKey=null;saveInProgress();render();window.scrollTo(0,0)}break;
    case "setdone":{const i=+b.dataset.i;const r=p.log[k][i];const nv=!r.done;markDone(k,i,nv);
      const f=p.flat.find(g=>g.k===k);const sec=p.L.sections[f.si],it=sec.items[f.ii];
      if(nv&&sec.key==="main"&&i<p.log[k].length-1){render();startTimer([{sec:it.rest,label:"Descanso"}],null)}
      else if(nv&&sec.key==="main"&&p.idx<p.flat.length-1){render();startTimer([{sec:Math.min(90,it.rest),label:"Descanso · sigue "+BY[p.L.sections[p.flat[p.idx+1].si].items[p.flat[p.idx+1].ii].id].n}],null)}
      else render();break}
    case "settimer":{const i=+b.dataset.i;const f=p.flat.find(g=>g.k===k);const it=p.L.sections[f.si].items[f.ii];const v=Number(p.log[k][i].v)||it.val;
      const ph=it.unit==="sl"?[{sec:v,label:"Lado 1",work:true},{sec:5,label:"Cambia de lado"},{sec:v,label:"Lado 2",work:true}]:[{sec:v,label:BY[it.id].n,work:true}];
      startTimer(ph,()=>{markDone(k,i,true);render();if(i<p.log[k].length-1)startTimer([{sec:it.rest,label:"Descanso"}],null)});break}
    case "simpletimer":{const f=p.flat.find(g=>g.k===k);const it=p.L.sections[f.si].items[f.ii];
      const ph=it.unit==="sl"?[{sec:it.val,label:"Lado 1",work:true},{sec:5,label:"Cambia de lado"},{sec:it.val,label:"Lado 2",work:true}]:[{sec:it.val,label:BY[it.id].n,work:true}];
      startTimer(ph,()=>{markDone(k,0,true);render()});break}
    case "testtimer":startTimer([{sec:5,label:"Prepárate"},{sec:+b.dataset.sec,label:"Prueba",work:true}],()=>{const el=document.getElementById("v-"+k+"-0");if(el)el.focus()});break;
    case "testdone":{const r=p.log[k][0];const el=document.getElementById("v-"+k+"-0");if(el)r.v=el.value;
      if(!r.done&&!(Number(r.v)>0)){const er=document.getElementById("err-"+k);if(er)er.textContent="Escribe tu resultado antes de guardar.";return}
      markDone(k,0,!r.done);render();if(r.done&&p.idx<p.flat.length-1&&p.L.sections[p.flat[p.idx+1].si].key==="test")startTimer([{sec:180,label:"Descanso entre pruebas"}],null);break}
    case "fintimer":{const f=p.flat[p.idx];const sec=p.L.sections[f.si];const ph=[{sec:5,label:"Prepárate"}];
      for(let r=1;r<=sec.rounds;r++)sec.items.forEach((it,j)=>{ph.push({sec:sec.work,label:BY[it.id].n,work:true,round:r});if(!(r===sec.rounds&&j===sec.items.length-1))ph.push({sec:sec.restI,label:"Descanso",round:r})});
      startTimer(ph,()=>{markDone(f.k,0,true);render()});break}
    case "t15":if(T){T.end+=15000;paintTimer()}break;
    case "tskip":if(T){T.end=Date.now()}break;
    case "finish":finishLevel();break;
    case "bikeform":st.bikeForm=true;render();break;
    case "bikecancel":st.bikeForm=false;render();break;
    case "bodyform":st.bodyForm=true;render();break;
    case "bodycancel":st.bodyForm=false;render();break;
    case "delbike":await remove("bici",b.dataset.id);render();break;
    case "catc":st.catC=b.dataset.c;render();break;
    case "ics":addToCalendar();break;
    case "catopen":st.catOpen=st.catOpen===b.dataset.id?null:b.dataset.id;render();break;
  }
});

async function exportBackup(){
  const payload={app:"encadena",version:1,fecha:today(),data:st.data,ajustes:st.cfg};
  const name="encadena-respaldo-"+today()+".json";
  const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
  let ok=false;
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Respaldo de Encadena"});ok=true}}catch(e){if(e&&e.name==="AbortError"){return}}
  if(!ok){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  try{localStorage.setItem("encadena-respaldo",today())}catch(e){}
  st.backupMsg="Respaldo guardado. Guárdalo en Archivos, Drive o mándatelo por correo.";st.backupErr=false;render();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="export"){exportBackup()}
  else if(a==="import"){const i=document.getElementById("impF");if(i)i.click()}
  else if(a==="importno"){st.pendingImport=null;render()}
  else if(a==="importyes"){const p=st.pendingImport;st.data={sesiones:p.data.sesiones,bici:p.data.bici,cuerpo:p.data.cuerpo};if(p.ajustes){st.cfg=Object.assign({},CFG_DEF,p.ajustes);saveCfg()}try{localStorage.setItem("encadena-datos",JSON.stringify(st.data))}catch(err){}
    st.pendingImport=null;st.backupMsg="Respaldo cargado.";st.backupErr=false;render()}
});
document.addEventListener("change",e=>{
  if(e.target.id!=="impF"||!e.target.files||!e.target.files[0])return;
  const f=e.target.files[0];const rdr=new FileReader();
  rdr.onload=()=>{try{const j=JSON.parse(rdr.result);const d=j&&j.data;
      if(j.app!=="encadena"||!d||!Array.isArray(d.sesiones)||!Array.isArray(d.bici)||!Array.isArray(d.cuerpo))throw new Error("formato");
      st.pendingImport={fecha:j.fecha||today(),data:d,ajustes:j.ajustes};st.backupMsg="";}
    catch(err){st.pendingImport=null;st.backupMsg="Ese archivo no es un respaldo de Encadena. Elige el archivo .json que guardaste desde aquí.";st.backupErr=true}
    render()};
  rdr.readAsText(f);
});
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}

</script>
